name: Website CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Prymalab
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Build-only fixtures. CI never connects to the production database.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-key-placeholder
      NEXT_PUBLIC_APP_URL: https://www.prymalab.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Prymalab/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check code quality
        run: npm run lint -- --max-warnings=0
      - name: Run regression tests
        run: npm test
      - name: Build production website
        run: npm run build
